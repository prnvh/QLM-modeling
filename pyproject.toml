[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmf-modeling"
version = "0.1.0"
description = "LMF (lucid memory field) research code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.7",
  "pytest>=7.4",
]

[project.optional-dependencies]
extras = [
  "wandb",
  "einops",
  "datasets",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lmf*"]
namespaces = true

[tool.setuptools.package-data]
lmf = ["infra/config/*.yaml"]
