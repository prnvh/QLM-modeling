# Stage 1 local smoke / dev defaults. Tune for your machine before long runs.

seed: 42
device: cpu

paths:
  data_dir: ./data
  artifacts_dir: ./artifacts
  checkpoints_dir: ./artifacts/checkpoints

model:
  num_traces: 1024
  active_traces: 32
  trace_dim: 32
  num_basins: 32
  relation_channels: 4
  settling_steps: 3
  direct_trace_to_basin_scale: 0.2
  bound_pair_to_basin_scale: 1.0
  interference_support_scale: 0.5
  interference_conflict_scale: 1.0
  interference_coexistence_scale: 0.35
  interference_suppression_scale: 0.5

decoder:
  trace_channel_scale: 0.7
  binding_channel_scale: 1.0
  basin_channel_scale: 1.3
  interference_channel_scale: 1.0
  lucidity_channel_scale: 1.0
  context_channel_scale: 1.0
  no_direct_cue_shortcut: true

readout_dropout:
  trace: 0.05
  binding: 0.10
  basin: 0.10
  interference: 0.10

training:
  batch_size: 16
  max_seq_len: 64
  lr: 0.001
  grad_clip: 1.0
  losses:
    reconstruction: 1.0
    sparsity: 0.01
    stability: 0.05
    basin_family_contrastive: 0.05
    coherence_conflict: 0.01
